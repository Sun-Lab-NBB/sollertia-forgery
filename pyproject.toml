# Defines the build system used for the project.
[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

# Project metadata section. Provides the general ID information about the project.
[project]
name = "sollertia-forgery"
version = "1.0.0rc5"
description = "Provides tools for processing and managing the data acquired using the Sollertia data acquisition platform."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Ivan Kondratyev" },
    { name = "Natalie Yeung" },
    { name = "Kushaan Gupta" },
]
maintainers = [
    { name = "Ivan Kondratyev", email = "ik278@cornell.edu" },
]

# The list of keywords that describe the project
keywords = ["sollertia", "dataset", "data", "processing"]

# Additional classifiers used by PIP to group repositories.
classifiers = [
    # Development status
    "Development Status :: 5 - Production/Stable",
    # Intended audience and project topic
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    # Supported Python Versions
    "Programming Language :: Python :: 3.14",
    # Supported Operating Systems
    "Operating System :: OS Independent",
    # Typing
    "Typing :: Typed",
]

# Runtime project dependencies.
dependencies = [
    # Sollertia Libraries
    "ataraxis-time>=6,<7",
    "ataraxis-base-utilities>=6.0.2,<7",
    "ataraxis-data-structures>=6.2.0rc1,<7",
    "sollertia-shared-assets>=9.1.0rc4,<10",

    # Acquisition and Processing Pipelines (called in-process by the behavior and forging pipelines)
    "ataraxis-video-system>=4,<5",
    "ataraxis-communication-interface>=6,<7",
    "cindra>=2.0.0rc3,<3",

    # Machine Vision (GenICam runtime for ataraxis-video-system, sourced from TestPyPI via [tool.uv.sources])
    "genicam==1.6.0",

    # Video Decoding (frame decoding and SIMD frame math for the motion-energy stage).
    # The wheel vendors its own FFmpeg, so no system ffmpeg binary is required.
    "opencv-python>=4.13,<5",

    # System Introspection (reads the host's physical memory when sizing a processing batch)
    "psutil>=6,<8",

    # Thread-Pool Control (holds the native BLAS and OpenMP pools at the cores each batch job was admitted at)
    "threadpoolctl>=3,<4",

    # Data Processing
    "polars>=1,<2",
    "numpy>=2,<3",
    "numba>=0.64,<1",
    # pandas and PyTables read DeepLabCut's 'table'-format HDF5 pose predictions in the video-tracking stage. The
    # predictions are written upstream by slvt/DeepLabCut on pandas 2 (numpy<2). Pandas 3 reads them bit-identically.
    "pandas>=3,<4",
    "tables>=3,<4",

    # Remote Execution
    "paramiko>=5,<6",

    # Model Context Protocol
    "mcp[cli]>=1,<2",

    # Utilities
    "filelock>=3,<4",
    "natsort>=8,<9",
    "tabulate>=0,<1",

    # Platform-Specific Acceleration
    "tbb4py>=2023,<2024; sys_platform != 'darwin'",
    "intel-cmplr-lib-rt>=2026,<2027; sys_platform != 'darwin'",
]

[project.urls]
Homepage = "https://github.com/Sun-Lab-NBB/sollertia-forgery"
Documentation = "https://sollertia-forgery-api-docs.netlify.app/"

# CLI interface. A single root command exposes the system-agnostic management commands, the agentic MCP server,
# the remote project-workflow orchestration group, and the system-specific 'mesoscope' command group.
[project.scripts]
slf = "sollertia_forgery.interfaces.entry_points:slf_cli"

# Development dependencies (PEP 735). Not published to PyPI.
[dependency-groups]
dev = [
    # Tox
    "tox>=4,<5",
    "uv>=0,<1",
    "tox-uv>=1,<2",

    # Development Automation (>=8.1.1 required alongside cindra>=2.0.0rc3, which needs importlib-metadata>=9)
    "ataraxis-automation>=8.1.1,<9",

    # Architecture (enforces the dependency-direction contracts declared under [tool.importlinter])
    "import-linter>=2,<3",

    # Types
    "types-psutil",
    "types-filelock>=3,<4",
    "types-tabulate>=0,<1",
    "types-paramiko>=5,<6",
    "pandas-stubs>=3,<4",
]

# Specifies files that should not be included in the source-code distribution but are also not part of gitignore.
[tool.hatch.build.targets.sdist]
exclude = [".github", "recipe"]

# Specifies the library structure.
[tool.hatch.build.targets.wheel]
packages = ["src/sollertia_forgery"]

# Ruff Configuration.
[tool.ruff]
line-length = 120         # Deviates from the commonly used '80' standard.
indent-width = 4          # Same as black, indents are 4 spaces
target-version = "py314"  # Targets the lowest supported version of python
src = ["src"]             # The name of the root source code directory

# Excludes 'service' .py files, such as the sphinx configuration file, from linting.
extend-exclude = ["conf.py"]

# Checks for all potential violations and uses the exclusions below to target-disable specific ones.
lint.select = ["ALL"]

# General ignore directives
lint.ignore = [
    "W291",    # Conflicts with docstring formatting
    "W293",    # Conflicts with UI style formatting
    "C901",    # Sometimes complex functions are necessary
    "PLR0913", # Sometimes complex functions are necessary
    "PLR0912", # Sometimes complex functions are necessary
    "PLR0915", # Sometimes complex type definitions are necessary
    "PLR0911", # Sometimes complex return graphs are necessary
    "PLR0917", # Call sites pass keyword arguments, so the positional count is immaterial
    "TID252",  # Conflicts with the project's import management strategy
    "BLE001",  # Catching blind exceptions is necessary for the functioning of this library
    "COM812",  # Conflicts with the formatter
    "ISC001",  # Conflicts with the formatter
    "PT001",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-182590771
    "PT023",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "D107",    # __init__ is documented inside the main class docstring where applicable
    "D205",    # Bugs out for file descriptions
    "PLW0603", # While global statement usage is not ideal, it streamlines certain development patterns
    "CPY001",  # The license is declared in the LICENSE file and the project metadata
]

# Additional formatting configurations
[tool.ruff.format]
quote-style = "double"             # Uses double quotes for strings
indent-style = "space"             # Uses space for indents
skip-magic-trailing-comma = false  # Like black, ignores trailing commas
line-ending = "auto"               # Automatically detects and standardizes line-ending character

# Docstrings and comments' line length
[tool.ruff.lint.pycodestyle]
max-doc-length = 120  # Maximum documentation line length, the same as code

# Docstrings style
[tool.ruff.lint.pydocstyle]
convention = "google"

# Additional, file-specific 'ignore' directives
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "F401", # Imported but unused
    "F403", # Wildcard imports
]
"**/tests/**/*.py" = [
    "ANN",     # Type annotations are not required in tests
    "D",       # Docstring enforcement is relaxed in tests
    "INP001",  # Tests use implicit namespace packages
    "PLR2004", # Magic values are common in test assertions
    "PT006",   # Parametrize argument-name style is a project choice
    "S101",    # Assert statements are how pytest tests verify behavior
    "SLF001",  # Private member access is needed for testing internals
    "T201",    # Print statements are allowed in tests
]

[tool.ruff.lint.isort]
case-sensitive = true              # Takes case into account when sorting imports
combine-as-imports = true          # Combines multiple "as" imports for the same package
force-wrap-aliases = true          # Wraps "as" imports so that each uses a separate line (after combining for package)
force-sort-within-sections = true  # Forces "as" and "from" imports for the same package to be close
length-sort = true                 # Places shorter imports first

# MyPy configuration section.
[tool.mypy]
disallow_untyped_defs = true # Enforces function annotation
warn_unused_ignores = true   # Warns against using 'type: ignore' for packages with type stubs

exclude = [
    "sollertia-forgery-\\d+",  # Ignores temporary folder created by setuptools when building the sdist
    "venv.*/",                 # Ignores virtual environments
    "build/",                  # Ignores the sdist directory
    "dist/",                   # Ignores the wheel directory
    "docs/",                   # Ignores the sphinx / doxygen directory
    "stubs/",                  # Ignores stubs directory (stubgen output target)
    "recipe/",                 # Ignores recipe directory (grayskull output target)
    "tests/",                  # Ignores the test directory.
]

[[tool.mypy.overrides]]
module = [
    "sollertia_forgery.server.server",
    "sollertia_forgery.server.job",
    "sollertia_forgery.server.server_configuration",
    "sollertia_forgery.interfaces.server_tools",
]
ignore_errors = true

# Pytest configuration. The import mode is declared here so that a bare 'pytest' invocation resolves test modules the
# same way the 'py314-test' tox task does.
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

# Places the repository root on sys.path, so that the 'tests' package is importable from the subprocesses the parallel
# pipeline tests spawn. The import mode above resolves test modules without touching sys.path, and a spawned worker
# inherits the parent's sys.path to import the module defining the callable it unpickles. The src layout keeps this
# entry from shadowing the installed distribution the tests measure coverage against.
pythonpath = ["."]

# This is used by the 'test' tox tasks to aggregate coverage data produced during pytest runtimes.
[tool.coverage.run]

# Measures branch coverage in addition to statement coverage, so that partial branches (one side of a conditional or
# loop that no test exercises) are reported as gaps rather than hidden behind full line coverage.
branch = true

# Excludes the interface layer from coverage measurement. Its modules (the Click CLI, the MCP server, and the MCP tool
# groups) only run inside a live CLI invocation or MCP session, so they require external infrastructure to exercise.
omit = [
    "src/sollertia_forgery/interfaces/*",
    "*/sollertia_forgery/interfaces/*",
]

# This is used by the 'test' tox tasks to aggregate coverage data produced during pytest runtimes.
[tool.coverage.paths]

# Maps coverage measured in site-packages to source files in src
source = ["src/", ".tox/*/lib/python*/site-packages/"]

# Same as above, specifies the output directory for the coverage .html report
[tool.coverage.html]
directory = "reports/coverage_html"

# Specifies additional ignore directives
[tool.coverage.report]
omit = [
    "src/sollertia_forgery/interfaces/*",
    "*/sollertia_forgery/interfaces/*",
]

# Fails the coverage report if combined statement and branch coverage drops below 100%, locking in full coverage of all
# measured modules and preventing regressions. The interface layer is omitted above, and pragma-excluded lines do not
# count against this threshold.
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __del__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]

# Import-linter contracts that enforce the library's dependency direction. Every layer may import the layers below it
# and none above it, so an acquisition-system package is reached only through the registries hub and the shared
# substrate depends on nothing. Modules sharing a layer are independent of one another, which is what keeps a system
# package out of the cross-system infrastructure and each worker package out of its siblings.
[tool.importlinter]
root_package = "sollertia_forgery"

[[tool.importlinter.contracts]]
name = "Dependencies flow from the shared substrate up to the interface layer"
type = "layers"
layers = [
    "sollertia_forgery.interfaces",
    "sollertia_forgery.orchestration",
    "sollertia_forgery.forging | sollertia_forgery.video | sollertia_forgery.runtime | sollertia_forgery.two_photon | sollertia_forgery.microcontrollers",
    "sollertia_forgery.registries",
    "sollertia_forgery.mesoscope_vr | sollertia_forgery.managing | sollertia_forgery.server",
    "sollertia_forgery.shared_assets",
]
