# Defines the build system used for the project.
[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

# Project metadata section. Provides the general ID information about the project.
[project]
name = "sollertia-forgery"
version = "1.0.0rc5"
description = "Provides tools for processing and managing the data acquired using the Sollertia data acquisition platform."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Ivan Kondratyev" },
    { name = "Natalie Yeung" },
    { name = "Kushaan Gupta" },
]
maintainers = [
    { name = "Ivan Kondratyev", email = "ik278@cornell.edu" },
]

keywords = ["sollertia", "dataset", "data", "processing"]

# Trove classifiers. PyPI uses them to group the project by audience, domain, python version, and platform.
classifiers = [
    # Development status
    "Development Status :: 5 - Production/Stable",
    # Intended audience and project topic
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    # Supported Python Versions
    "Programming Language :: Python :: 3.14",
    # Supported Operating Systems
    "Operating System :: OS Independent",
    # Typing
    "Typing :: Typed",
]

dependencies = [
    # Sollertia Libraries
    "ataraxis-time>=7,<8",
    "ataraxis-base-utilities>=7,<8",
    "ataraxis-data-structures>=7.1,<8",  # 7.1 first exports the log-archive, marker, and worker-thread helpers
    "sollertia-shared-assets>=10.0.0rc3,<11",  # rc3 first exports the per-system session type registry

    # Acquisition and Processing Pipelines (called in-process by the video, microcontroller, two-photon, and forging
    # pipelines)
    "ataraxis-video-system>=5.1,<6",  # 5.1 first exports the OutputLayout against which the video pipeline resolves
    "ataraxis-communication-interface>=7.1,<8",  # 7.1 first exports the serial protocol and prototype enums
    "cindra>=2.0.0rc6,<3",  # rc6 first exports the pipeline data records, including the combined recording metadata

    # Video Decoding (frame decoding and SIMD frame math for the motion-energy stage).
    # The wheel vendors its own FFmpeg, so no system ffmpeg binary is required.
    "opencv-python>=5,<6",

    # System Introspection (reads the host's physical memory when sizing a processing batch)
    "psutil>=7,<8",

    # Thread-Pool Control (holds the native BLAS and OpenMP pools at the cores each batch job occupies)
    "threadpoolctl>=3,<4",

    # Data Processing
    "polars>=1,<2",
    "numpy>=2,<3",
    "numba>=0.64,<1",
    # pandas and PyTables read DeepLabCut's 'table'-format HDF5 pose predictions in the video-tracking stage. The
    # predictions are written upstream by slvt/DeepLabCut on pandas 2 (numpy<2). Pandas 3 reads them bit-identically.
    "pandas>=3,<4",
    "tables>=3,<4",

    # Remote Execution
    "paramiko>=5,<6",

    # Command-Line Interface and MCP Server
    "click>=8,<9",
    "mcp>=2,<3",

    # Utilities
    "filelock>=3,<4",
    "natsort>=8,<9",
    "tabulate>=0,<1",
    # YAML serialization (used directly by the MCP server-configuration tools to stage the caller-supplied payload for
    # YamlConfig validation)
    "pyyaml>=6,<7",

    # Platform-Specific Acceleration. Supplies the TBB runtime the package selects as Numba's threading layer on every
    # platform other than macOS, which has no Apple Silicon 'tbb4py' wheel and falls back to OpenMP.
    "tbb4py>=2023,<2024; sys_platform != 'darwin'",
    # Supplies the SVML runtime Numba's vectorization path loads. The path stays inert while llvmlite reports no SVML
    # support, and the pin is held so that a Numba release restoring it needs no packaging change here.
    "intel-cmplr-lib-rt>=2026,<2027; sys_platform != 'darwin'",
]

# Project repository and hosted documentation URLs.
[project.urls]
Homepage = "https://github.com/Sun-Lab-NBB/sollertia-forgery"
Documentation = "https://sollertia-forgery-api-docs.netlify.app/"

# CLI interface. A single root command exposes the system-agnostic management commands ('manifest', 'checksum',
# 'dataset-state', 'server', 'reset', 'clean', 'omp'), the agentic MCP server ('mcp'), and the generic 'process',
# 'forge', and 'plan' commands.
[project.scripts]
slf = "sollertia_forgery.interfaces.entry_points:slf_cli"

# Development dependencies (PEP 735). Not published to PyPI.
[dependency-groups]
dev = [
    # Tox
    "tox>=4,<5",
    "uv>=0,<1",
    "tox-uv>=1,<2",

    # Development Automation
    "ataraxis-automation>=9,<10",

    # Types
    "types-psutil>=7,<8",
    "types-filelock>=3,<4",
    "types-tabulate>=0,<1",
    "types-paramiko>=5,<6",
    "types-pyyaml>=6,<7",
    "pandas-stubs>=3,<4",

    # Test-suite fixtures. The test corpus imports both directly: 'tifffile' writes the synthetic stacks the imaging
    # footprint tests read, and 'platformdirs' is monkeypatched to redirect the platform data directory the shared
    # assets library resolves.
    "tifffile>=2026,<2027",
    "platformdirs>=4,<5",
]

# Specifies files that should not be included in the source-code distribution but are also not part of gitignore.
[tool.hatch.build.targets.sdist]
exclude = [".github", "recipe"]

# Specifies the library structure.
[tool.hatch.build.targets.wheel]
packages = ["src/sollertia_forgery"]

# Ruff Configuration.
[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"  # Targets the lowest supported version of python
src = ["src"]

# Excludes 'service' .py files, such as the sphinx configuration file, from linting.
extend-exclude = ["conf.py"]

# Checks for all potential violations and uses the exclusions below to target-disable specific ones.
lint.select = ["ALL"]

# General ignore directives
lint.ignore = [
    # Universal lint.ignore corpus. Present in every Ataraxis framework and Sollertia platform project.
    "W291",    # Conflicts with docstring formatting
    "ANN401",  # While suboptimal, ANY is a helpful type when used with caution
    "BLE001",  # Broad exception handling is necessary at library boundaries
    "C901",    # Sometimes complex functions are necessary
    "PLR0911", # Sometimes complex return graphs are necessary
    "PLR0912", # Sometimes complex functions are necessary
    "PLR0913", # Sometimes complex functions are necessary
    "PLR0915", # Sometimes functions with many statements are necessary
    "PLR0917", # PLR0913 already covers argument counts, and call sites pass keyword arguments
    "COM812",  # Conflicts with the formatter
    "ISC001",  # Conflicts with the formatter
    "PT001",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "PT023",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "D107",    # __init__ is documented inside the main class docstring where applicable
    "D205",    # Bugs out for file descriptions
    "PLW0603", # While global statement usage is not ideal, it streamlines certain development patterns
    "TID252",  # Conflicts with the library import management strategy, which requires parent-relative imports
    "CPY001",  # The license is declared in the LICENSE file and the license and license-files metadata fields

    # Project-specific
    "W293",    # Reserved for multi-line string literals whose blank lines must hold the surrounding indentation
]

# Additional formatting configurations
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false  # Like black, honors magic trailing commas
line-ending = "auto"               # Automatically detects and standardizes line-ending character

# Docstrings and comments' line length
[tool.ruff.lint.pycodestyle]
max-doc-length = 120  # Maximum documentation line length, the same as code

# Docstrings style
[tool.ruff.lint.pydocstyle]
convention = "google"

# Additional, file-specific 'ignore' directives
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "F401", # Imported but unused
    "F403", # Wildcard imports
]
"tests/**/*.py" = [
    # Shared test corpus. These entries are present in every Ataraxis framework and Sollertia platform project.
    "S101",    # Tests assert by design
    "PLR2004", # Expected values are clearer inline than as named constants
    "INP001",  # The test directory is not an importable package
    "SLF001",  # Tests exercise private module members directly
    "PT006",   # Parametrize argument names are declared as a single comma-separated string
    "ARG001",  # Pytest injects fixtures that individual tests may not reference
    "T201",    # Diagnostic prints are how a test reports intermediate state
    "D",       # Test names and inline comments carry the intent that docstrings carry in library code
    "ANN",     # Test functions and mock helpers do not need annotations
]

# Import sorting and grouping configurations
[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true          # Combines multiple "as" imports for the same package
force-wrap-aliases = true          # Wraps "as" imports so that each uses a separate line
force-sort-within-sections = true  # Forces "as" and "from" imports for the same package to be close
length-sort = true                 # Places shorter imports first

# MyPy configuration section.
[tool.mypy]
disallow_untyped_defs = true # Enforces function annotation
warn_unused_ignores = true   # Warns against using 'type: ignore' for packages with type stubs

exclude = [
    "sollertia_forgery-\\d+",  # Ignores the temporary folder created when building the sdist
    "venv.*/",
    "build/",                  # Ignores the build backend's working directory
    "dist/",
    "docs/",                   # Ignores the sphinx / doxygen directory
    "stubs/",                  # Ignores stubs directory (stubgen output target)
    "recipe/",                 # Ignores recipe directory (grayskull output target)
    "tests/",
]

# The server modules build their payloads from runtime data the annotations cannot express, so type errors
# inside them are suppressed rather than annotated away.
[[tool.mypy.overrides]]
module = [
    "sollertia_forgery.server.server",
    "sollertia_forgery.server.job",
    "sollertia_forgery.server.server_configuration",
    "sollertia_forgery.interfaces.server_tools",
]
ignore_errors = true

# threadpoolctl ships no py.typed marker and publishes no stub distribution, so the module that bounds the native
# thread pools through it is checked against an untyped import rather than failing on the import itself.
[[tool.mypy.overrides]]
module = ["threadpoolctl"]
ignore_missing_imports = true

# Pytest configuration. The import mode is declared here so that a bare 'pytest' invocation resolves test modules the
# same way the '{py}-test' tox task does.
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

# Places the repository root on sys.path, so that the 'tests' package is importable from the subprocesses the parallel
# pipeline tests spawn. The import mode above resolves test modules without touching sys.path, and a spawned worker
# inherits the parent's sys.path to import the module defining the callable it unpickles. The src layout keeps this
# entry from shadowing the installed distribution against which the tests measure coverage.
pythonpath = ["."]

# Configures the coverage data the '{py}-test' tox task collects. Most of the interface layer is excluded from
# measurement, as the Click command modules, the MCP server, and the MCP tool modules reach external infrastructure
# that only a live CLI invocation or MCP session supplies. The exclusions are listed per module rather than as a
# directory glob, so that a module added to the layer is measured by default and exempting it stays a deliberate edit.
# The modules absent from this list hold the shared response and server-instance plumbing the measured tests import.
[tool.coverage.run]
branch = true  # Reports a conditional or loop whose alternate path no test takes as a gap
omit = [
    "*/sollertia_forgery/interfaces/entry_points.py",
    "*/sollertia_forgery/interfaces/forge.py",
    "*/sollertia_forgery/interfaces/forging_tools.py",
    "*/sollertia_forgery/interfaces/host_resolution.py",
    "*/sollertia_forgery/interfaces/manage.py",
    "*/sollertia_forgery/interfaces/management_tools.py",
    "*/sollertia_forgery/interfaces/mcp_server.py",
    "*/sollertia_forgery/interfaces/plan.py",
    "*/sollertia_forgery/interfaces/planning_tools.py",
    "*/sollertia_forgery/interfaces/process.py",
    "*/sollertia_forgery/interfaces/processing_tools.py",
    "*/sollertia_forgery/interfaces/remote_tools.py",
    "*/sollertia_forgery/interfaces/server.py",
    "*/sollertia_forgery/interfaces/server_tools.py",
]

# Used by the 'coverage' tox task to merge the coverage data files the '{py}-test' tasks produce.
[tool.coverage.paths]

# Maps coverage measured in site-packages to source files in src. The second pattern matches the POSIX virtual
# environment layout and the third matches the Windows layout, which omits the 'python*' path component. Both are
# required for the 'coverage' task to merge the data measured on either host into a single record per source file.
source = [
    "src/",
    ".tox/*/lib/python*/site-packages/",
    ".tox/*/Lib/site-packages/",
]

# Same as above, specifies the output directory for the coverage .html report
[tool.coverage.html]
directory = "reports/coverage_html"

# Specifies the coverage gate and additional ignore directives
[tool.coverage.report]
fail_under = 100     # Requires the test suite to cover every measured statement and branch
show_missing = true  # Lists the statements missed by the test suite, so a failed check names the lines to cover
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __del__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    '^\s*pass$',
]

